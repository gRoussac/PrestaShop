# Dependabot version updates for composer and GitHub Actions.
# Security-tab Dependabot alerts are a separate org Settings toggle.
# Majors: human review on every PR; do not auto-merge.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
